name: osm-relay
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Kjør køen
        run: python3 relay.py
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
      # GitHub slår av planlagte jobber i repoer uten aktivitet i 60 dager. Én liten oppdatering per døgn holder den i gang.
      - name: Livstegn (én gang i døgnet)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 30 ]; then
            date -u +%Y-%m-%dT%H:%MZ > last_run.txt
            git config user.name "osm-relay"; git config user.email "osm-relay@users.noreply.github.com"
            git add last_run.txt && git commit -m "livstegn $(date -u +%F)" && git push || true
          fi
